# Конфигурация gitleaks для сканирования секретов в коммитах.
# Документация: https://github.com/gitleaks/gitleaks

[extend]
# Используем встроенный набор правил по умолчанию.
useDefault = true

[allowlist]
description = "Допустимые исключения: шаблоны и документация"

# Файлы, в которых секреты не ищем (шаблоны и примеры).
paths = [
  '''\.env\.example$''',
  '''scripts/samples/''',
]

# Тестовые/учебные значения, которые не считаются утечкой.
regexes = [
  '''change_me''',
  '''твой-ключ''',
]
