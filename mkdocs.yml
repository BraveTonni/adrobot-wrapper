site_name: adrobot-wrapper
docs_dir: docs
site_dir: mkdocs-site
strict: true

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему

nav:
  - Общее:
      - Обзор: index.md
      - Контейнеры: containers.md
      - Участие в разработке: contributing.md
  - Backend:
      - Архитектура: backend/architecture.md
      - HTTP API: backend/api.md
      - Конфигурация: backend/configuration.md
      - Разработка и запуск: backend/development.md
      - Эксплуатация: backend/operations.md

validation:
  links:
    not_found: warn
    anchors: warn
