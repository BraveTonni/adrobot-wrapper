[project]
name = "adrobot-wrapper"
version = "0.1.0"
description = "Веб-сервис поверх Admin API Keitaro: создаватор кампаний и редактор офферов"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128",
    "uvicorn>=0.37",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "pycountry>=24.6",
    "asyncpg>=0.31",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "mkdocs-material>=9.6,<10",
]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that call external services"]
filterwarnings = [
    # Starlette предупреждает о transport на httpx у testclient; приложение
    # и тесты намеренно используют один и тот же httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
