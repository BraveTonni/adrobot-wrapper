[project]
name = "adrobot-wrapper"
version = "0.1.0"
description = "Веб-сервис поверх Admin API Keitaro: создаватор кампаний и редактор офферов"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
