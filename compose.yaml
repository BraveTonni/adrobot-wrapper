name: adrobot-wrapper

services:
  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    # The official entrypoint runs as root only to prepare the data directory
    # and then drops to the unprivileged `postgres` user.
    environment:
      POSTGRES_USER: adrobot
      POSTGRES_DB: adrobot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adrobot -d adrobot"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: adrobot-wrapper-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYDANTIC_SECRETS_DIR: /run/secrets
    secrets:
      - database_url
    volumes:
      - backend_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    restart: "no"

  backend:
    image: adrobot-wrapper-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PYDANTIC_SECRETS_DIR: /run/secrets
      KEITARO_URL: ${KEITARO_URL:-https://keitaro-for-tests.etolegko.com/admin_api/v1}
      KEITARO_ADMIN_URL: ${KEITARO_ADMIN_URL:-https://keitaro-for-tests.etolegko.com/admin}
      KEITARO_TIMEOUT: ${KEITARO_TIMEOUT:-15}
      DEFAULT_DOMAIN_ID: ${DEFAULT_DOMAIN_ID:-1813}
      DEFAULT_GROUP_ID: ${DEFAULT_GROUP_ID:-10332}
      DEFAULT_SOURCE_ID: ${DEFAULT_SOURCE_ID:-836}
      GEO_REDIRECT_URL: ${GEO_REDIRECT_URL:-https://google.com}
      EDITOR_PUBLISH_MODE: ${EDITOR_PUBLISH_MODE:-direct}
      OFFERS_CACHE_TTL: ${OFFERS_CACHE_TTL:-300}
      REFERENCE_CACHE_TTL: ${REFERENCE_CACHE_TTL:-300}
      CAMPAIGN_SEARCH_LIMIT: ${CAMPAIGN_SEARCH_LIMIT:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIRECTORY: /app/logs
    secrets:
      - database_url
      - keitaro_api_key
      - api_access_token
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Optional web client; enable with the frontend Compose profile.
  frontend:
    profiles:
      - frontend
    image: adrobot-wrapper-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:8000
      API_ACCESS_TOKEN_FILE: /run/secrets/api_access_token
      FRONTEND_AUTH_PASSWORD_FILE: /run/secrets/frontend_auth_password
    secrets:
      - api_access_token
      - frontend_auth_password
    ports:
      - "127.0.0.1:3000:3000"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    init: true

secrets:
  postgres_password:
    file: ./backend/.secrets/postgres_password
  database_url:
    file: ./backend/.secrets/database_url
  keitaro_api_key:
    file: ./backend/.secrets/keitaro_api_key
  api_access_token:
    file: ./backend/.secrets/api_access_token
  frontend_auth_password:
    file: ./backend/.secrets/frontend_auth_password

volumes:
  backend_data:
  postgres_data:
